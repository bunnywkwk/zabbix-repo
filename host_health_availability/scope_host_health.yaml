zabbix_export:
  version: '8.0'
  template_groups:
  - uuid: edfd22a248e64e6180afd9c250651a47
    name: Linux servers
  templates:
  - uuid: 9dcdc417e84944e1990cf4f2283fc98d
    template: Scope Host Health and Availability
    name: 'Scope: Host Health & Availability'
    description: Targeted Master Template with explicit critical services.
    groups:
    - name: Linux servers
    items:
    - uuid: c12f1a079a9142729599345e06613606
      name: Zabbix Agent Ping
      type: ZABBIX_ACTIVE
      key: agent.ping
      value_type: UNSIGNED
      delay: 1m
      triggers:
      - uuid: 99ac79b1ce694bef8eb37c0f8989aee7
        expression: nodata(/Scope Host Health and Availability/agent.ping,3m)=1
        name: '[OBS-F-001] CRITICAL: Zabbix agent is unreachable for 3 minutes'
        priority: HIGH
    - uuid: 260a6aa99dd840dd80a2526232a0a0e9
      name: System Uptime
      type: ZABBIX_ACTIVE
      key: system.uptime
      value_type: UNSIGNED
      units: uptime
      delay: 1m
      triggers:
      - uuid: 6e8c7199edad4952ba3fae377a0b19c9
        expression: last(/Scope Host Health and Availability/system.uptime)<10m
        name: '[OBS-F-005] WARNING: Host has been restarted (uptime < 10m)'
        priority: WARNING
    - uuid: d3c50d8e79ab48febe488be18589326a
      name: CPU Utilisation
      type: ZABBIX_ACTIVE
      key: system.cpu.util
      value_type: FLOAT
      units: '%'
      delay: 1m
      triggers:
      - uuid: f7f1b32dae5b4653ace4096480443599
        expression: min(/Scope Host Health and Availability/system.cpu.util,5m)>95
        name: '[OBS-F-003] CRITICAL: CPU > 95%'
        priority: HIGH
      - uuid: 4b9abccc83e2433a983dbb7d64294b00
        expression: min(/Scope Host Health and Availability/system.cpu.util,5m)>80
        name: '[OBS-F-003] WARNING: CPU > 80%'
        priority: WARNING
        dependencies:
        - name: '[OBS-F-003] CRITICAL: CPU > 95%'
          expression: min(/Scope Host Health and Availability/system.cpu.util,5m)>95
    - uuid: ff109ecb8499469f8fc52bcc54d959f6
      name: CPU I/O Wait
      type: ZABBIX_ACTIVE
      key: system.cpu.util[,iowait]
      value_type: FLOAT
      units: '%'
      delay: 1m
      triggers:
      - uuid: fefa5ddca1cb420a99f94fda04845aa4
        expression: min(/Scope Host Health and Availability/system.cpu.util[,iowait],5m)>40
        name: '[OBS-F-003] CRITICAL: CPU I/O Wait > 40% (5m)'
        priority: HIGH
      - uuid: 38a9b7b7264946efb1ae15bae25edceb
        expression: min(/Scope Host Health and Availability/system.cpu.util[,iowait],5m)>20
        name: '[OBS-F-003] WARNING: CPU I/O Wait > 20% (5m)'
        priority: WARNING
        dependencies:
        - name: '[OBS-F-003] CRITICAL: CPU I/O Wait > 40% (5m)'
          expression: min(/Scope Host Health and Availability/system.cpu.util[,iowait],5m)>40
    - uuid: da5db9a2c04d430c87facb0dd63853d7
      name: Available Memory
      type: ZABBIX_ACTIVE
      key: vm.memory.size[pavailable]
      value_type: FLOAT
      units: '%'
      delay: 1m
      triggers:
      - uuid: a807a072eb6e4fabb2cb0b0f89fd4ffa
        expression: last(/Scope Host Health and Availability/vm.memory.size[pavailable])<10
        name: '[OBS-F-003] CRITICAL: Mem < 10%'
        priority: HIGH
      - uuid: f7a8ec80c13c40c7827f9c0dd7538ca6
        expression: last(/Scope Host Health and Availability/vm.memory.size[pavailable])<20
        name: '[OBS-F-003] WARNING: Mem < 20%'
        priority: WARNING
        dependencies:
        - name: '[OBS-F-003] CRITICAL: Mem < 10%'
          expression: last(/Scope Host Health and Availability/vm.memory.size[pavailable])<10
    - uuid: 5cac75211b1a4a12806d6e396633e20e
      name: Free Swap
      type: ZABBIX_ACTIVE
      key: system.swap.size[,pfree]
      value_type: FLOAT
      units: '%'
      delay: 1m
      triggers:
      - uuid: 13a0361c9aab4a39b18823d439056a7e
        expression: last(/Scope Host Health and Availability/system.swap.size[,pfree])<10
        name: '[OBS-F-003] WARNING: Swap < 10%'
        priority: WARNING
    - uuid: 5d3e9481669949f8b27350e29b35c9e0
      name: Kernel Errors Log
      type: ZABBIX_ACTIVE
      key: log[/var/log/messages,"error|failed|panic"]
      value_type: LOG
      delay: 1s
    - uuid: 868fe899b2384dccafc45711c881d730
      name: Out of Memory Log
      type: ZABBIX_ACTIVE
      key: log[/var/log/messages,"Out of memory"]
      value_type: LOG
      delay: 1s
    - uuid: 4ccca982a0b747c493ab1e68a6b7bbd3
      name: Lifecycle Event Log
      type: ZABBIX_ACTIVE
      key: log[/var/log/messages,"shutdown|reboot|Starting up"]
      value_type: LOG
      delay: 1s
    - uuid: 0c59ad7c7f674d6ca8e33064598147a3
      name: Boot Outcome Log
      type: ZABBIX_ACTIVE
      key: log[/var/log/messages,"Failed to start"]
      value_type: LOG
      delay: 1s
    - uuid: 0433944f0c7d4a9c8b1693f2dd28c07f
      name: 'Process CPU: Zabbix Agent'
      type: ZABBIX_ACTIVE
      key: proc.cpu.util[zabbix_agent2]
      value_type: FLOAT
      units: '%'
      delay: 1m
    - uuid: b6afa24c77aa497596960d8cedaa748b
      name: 'Process Mem: Zabbix Agent'
      type: ZABBIX_ACTIVE
      key: proc.mem[zabbix_agent2,rss]
      value_type: UNSIGNED
      units: B
      delay: 1m
    - uuid: fa053d81b50e4adb93a72ae58bd8c5fe
      name: Global Max File Descriptors
      type: ZABBIX_ACTIVE
      key: kernel.maxfiles
      value_type: UNSIGNED
      delay: 10m
    - uuid: 2f00a5d2f8bb402c8f92979cb5086333
      name: Used File Descriptors
      type: ZABBIX_ACTIVE
      key: vfs.file.contents[/proc/sys/fs/file-nr]
      value_type: UNSIGNED
      delay: 1m
      preprocessing:
      - type: REGEX
        parameters:
        - ^(\d+)
        - "\x01"
    - uuid: b141a2c7dc5d42498686aab340bd3fd0
      name: File Descriptor Usage Percentage
      type: CALCULATED
      key: fd.usage.percent
      value_type: FLOAT
      units: '%'
      delay: 1m
      params: 100 * last(//vfs.file.contents[/proc/sys/fs/file-nr]) / last(//kernel.maxfiles)
      triggers:
      - uuid: e1fe05aafaad49d19c44df0fae93e27e
        expression: last(/Scope Host Health and Availability/fd.usage.percent)>85
        name: '[OBS-F-018] CRITICAL: File Descriptor Usage > 85%'
        priority: HIGH
      - uuid: 2d508e7940124aa995455515c7b7a3fc
        expression: last(/Scope Host Health and Availability/fd.usage.percent)>70
        name: '[OBS-F-018] WARNING: File Descriptor Usage > 70%'
        priority: WARNING
        dependencies:
        - name: '[OBS-F-018] CRITICAL: File Descriptor Usage > 85%'
          expression: last(/Scope Host Health and Availability/fd.usage.percent)>85
    - uuid: 2a9c1beaa2d84b6791cde0cc29d223fb
      name: 'Service Status: SSH'
      type: ZABBIX_ACTIVE
      key: systemd.unit.info[sshd.service,ActiveState]
      value_type: CHAR
      delay: 1m
      triggers:
      - uuid: ed16a37da9214dac90df22ae021b37f0
        expression: last(/Scope Host Health and Availability/systemd.unit.info[sshd.service,ActiveState])<>"active"
        name: '[OBS-F-004] CRITICAL: SSH Service is down'
        priority: HIGH
    - uuid: 00979a20237341dbb26d9c10c32cbd1f
      name: 'Service Restarts: SSH'
      type: ZABBIX_ACTIVE
      key: systemd.unit.info[sshd.service,NRestarts]
      value_type: UNSIGNED
      delay: 1m
      triggers:
      - uuid: 18899b2492c94cb1923f8fe4fb6ce1e6
        expression: (last(/Scope Host Health and Availability/systemd.unit.info[sshd.service,NRestarts])
          - min(/Scope Host Health and Availability/systemd.unit.info[sshd.service,NRestarts],10m))
          >= 5
        name: '[OBS-F-017] CRITICAL: SSH Service restarted 5 times in 10m'
        priority: HIGH
      - uuid: 84cff71c19e24c25847f3c0067951a7a
        expression: (last(/Scope Host Health and Availability/systemd.unit.info[sshd.service,NRestarts])
          - min(/Scope Host Health and Availability/systemd.unit.info[sshd.service,NRestarts],10m))
          >= 3
        name: '[OBS-F-017] WARNING: SSH Service restarted 3 times in 10m'
        priority: WARNING
        dependencies:
        - name: '[OBS-F-017] CRITICAL: SSH Service restarted 5 times in 10m'
          expression: (last(/Scope Host Health and Availability/systemd.unit.info[sshd.service,NRestarts])
            - min(/Scope Host Health and Availability/systemd.unit.info[sshd.service,NRestarts],10m))
            >= 5
